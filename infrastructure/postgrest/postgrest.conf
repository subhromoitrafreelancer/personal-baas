# Reference PostgREST configuration for local (non-Docker) runs.
#
# The docker-compose service (infrastructure/docker/docker-compose.yml) configures PostgREST
# entirely through PGRST_* environment variables instead of mounting this file, so that the
# authenticator password never has to be templated into a committed config file. This file
# documents the equivalent settings and is useful for running `postgrest` directly against a
# local Postgres during development.
#
# Only the `api` schema is ever exposed (scope.md §12); `auth`, `platform` and `private` must
# never appear in db-schemas.

db-uri = "postgres://authenticator:CHANGE_ME@localhost:5432/personal_baas"
db-schemas = "api"
db-anon-role = "anon"
db-pool = 10

server-host = "0.0.0.0"
server-port = 3001

# JWT verification (Phase 4.1, scope.md §8-9). The docker-compose service sets this from
# AUTH_JWT_PUBLIC_KEY_JWK (see apps/control-server/scripts/generate-jwt-keypair.mjs) — a
# literal JWK object, not a PEM string; PostgREST's asymmetric jwt-secret only accepts JWK for
# non-HMAC keys. Paste the JWK your control-server was configured with if running locally:
# jwt-secret = "{\"crv\":\"Ed25519\",\"x\":\"...\",\"kty\":\"OKP\"}"
# jwt-aud = "authenticated"
