# Reference PostgREST configuration for local (non-Docker) runs.
#
# The docker-compose service (infrastructure/docker/docker-compose.yml) configures PostgREST
# mostly through PGRST_* environment variables, so that the authenticator password never has to
# be templated into a committed config file — the one exception is db-schemas, which since
# Phase 9 (scope.md §23 point 7) lives in a separate writable file
# (postgrest.conf.template → the `postgrest_config` volume) that control-server rewrites as
# projects are created, since env vars can't be changed for an already-running container. This
# file documents the equivalent settings and is useful for running `postgrest` directly against
# a local Postgres during development.
#
# Only the `api` schema is exposed by default (scope.md §12); `auth`, `platform` and `private`
# must never appear in db-schemas. Additional api_<slug> project schemas are appended here at
# runtime by the docker-compose setup — this local reference file only lists the default.

db-uri = "postgres://authenticator:CHANGE_ME@localhost:5432/personal_baas"
db-schemas = "api"
db-anon-role = "anon"
db-pool = 10

server-host = "0.0.0.0"
server-port = 3001

# JWT verification (Phase 4.1, scope.md §8-9). The docker-compose service sets this from
# AUTH_JWT_PUBLIC_KEY_JWK (see apps/control-server/scripts/generate-jwt-keypair.mjs) — a
# literal JWK object, not a PEM string; PostgREST's asymmetric jwt-secret only accepts JWK for
# non-HMAC keys. Paste the JWK your control-server was configured with if running locally:
# jwt-secret = "{\"crv\":\"Ed25519\",\"x\":\"...\",\"kty\":\"OKP\"}"
# jwt-aud = "authenticated"
