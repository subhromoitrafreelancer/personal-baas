name: personal-baas

services:
  postgres:
    build:
      context: ../../
      dockerfile: infrastructure/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BAAS_ADMIN_PASSWORD: ${BAAS_ADMIN_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: seeds the shared postgrest_config volume from the committed template, but only
  # the first time (never overwrites an existing file) — control-server owns the live copy
  # after that, rewriting its db-schemas line as projects are created (Phase 9, scope.md §23
  # point 7). Mirrors the minio-createbucket / database-bootstrap one-shot init pattern.
  postgrest-init:
    image: busybox:1.36
    volumes:
      - ../postgrest/postgrest.conf.template:/template/postgrest.conf:ro
      - postgrest_config:/out
    entrypoint: >
      /bin/sh -c "
      test -f /out/postgrest.conf || cp /template/postgrest.conf /out/postgrest.conf
      "

  postgrest:
    image: postgrest/postgrest:v12.2.3
    # db-schemas lives in the mounted config file below instead of PGRST_DB_SCHEMAS (Phase 9,
    # scope.md §23 point 7) — it's the one setting that needs to change without a rebuild as
    # projects are created; env vars can't be changed for an already-running container, so it
    # can't stay one. Everything else stays an env var, same as before.
    command: ['/bin/postgrest', '/etc/postgrest/postgrest.conf']
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_ANON_ROLE: anon
      PGRST_SERVER_PORT: 3001
      # Verifies application-user JWTs signed by control-server (scope.md §8). Needs the
      # literal JWK (quoted so its braces/colons aren't parsed as YAML), not a PEM string —
      # PostgREST's asymmetric jwt-secret only accepts JWK for non-HMAC keys.
      PGRST_JWT_SECRET: '${AUTH_JWT_PUBLIC_KEY_JWK}'
      PGRST_JWT_AUD: authenticated
      # Enforces API key revocation (Phase 4.4) — runs before every request; a no-op for
      # ordinary user JWTs, which carry no `kid` claim.
      PGRST_DB_PRE_REQUEST: platform.check_api_key_revocation
    volumes:
      - postgrest_config:/etc/postgrest
    depends_on:
      postgres:
        condition: service_healthy
      postgrest-init:
        condition: service_completed_successfully
    # No Docker HEALTHCHECK: this image ships only the static postgrest binary, no shell or
    # HTTP client to run one with. control-server's /health/ready checks this service's
    # reachability instead, and Caddy's own healthcheck below exercises the real proxy path to it.

  control-server:
    build:
      context: ../../
      dockerfile: apps/control-server/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://baas_admin:${BAAS_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64}
      AUTH_JWT_PUBLIC_KEY_BASE64: ${AUTH_JWT_PUBLIC_KEY_BASE64}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      POSTGREST_URL: http://postgrest:3001
      # Shared with the postgrest service (see the postgrest_config volume below) — control-server
      # is the only writer, rewriting the db-schemas line as projects are created (scope.md §23
      # point 7); a human still has to `docker compose restart postgrest` to pick it up.
      POSTGREST_CONFIG_PATH: /etc/postgrest/postgrest.conf
      # MinIO (Phase 7 #1/#3) — control-server is the only thing that ever holds these
      # credentials; browsers/clients only ever talk to /storage/v1/* on control-server.
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-baas-storage}
    ports:
      - '3000:3000'
    volumes:
      - postgrest_config:/etc/postgrest
    depends_on:
      postgres:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
      postgrest-init:
        condition: service_completed_successfully
    healthcheck:
      # Use 127.0.0.1, not localhost: on Alpine, wget resolves localhost to ::1 first, but the
      # server only binds IPv4 (0.0.0.0), so "localhost" spuriously fails with "connection refused".
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # Single real MinIO bucket for the whole deployment (scope.md §21) — logical developer-facing
  # "buckets" are key prefixes tracked in storage.buckets, not real MinIO buckets. No host port
  # published: only control-server (over the docker network) ever talks to this.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Recommended-by-upstream healthcheck trick: pre-configures an "local" mc alias pointing
      # at this same container so `mc ready local` below needs no separate `mc alias set` step.
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bootstrap (mirrors packages/database-bootstrap's role/schema init pattern): creates
  # the single real bucket, then exits. control-server's own startup waits on this completing.
  minio-createbucket:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET:-baas-storage}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-baas-storage}

  caddy:
    image: caddy:2-alpine
    environment:
      # Defaults to "localhost" (self-signed via Caddy's internal CA — see Caddyfile comment).
      # Set to a real domain (with ports 80/443 reachable from the internet) for automatic,
      # auto-renewing Let's Encrypt HTTPS instead.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - '8000:8000'
      - '80:80'
      - '443:443'
    depends_on:
      control-server:
        condition: service_healthy
      postgrest:
        condition: service_started
    healthcheck:
      # Exercises the real proxy path through to PostgREST, which has no healthcheck of its own
      # (see comment above) — this is this project's only end-to-end check of that hop.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8000/rest/v1/']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  minio_data:
  postgrest_config:
