<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Todo App — personal-baas example</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Todo App</h1>
    <p class="subtitle">A reference client for personal-baas — Auth + REST + Storage, no build step.</p>
  </header>

  <main>
    <section id="auth-view">
      <p id="auth-error" class="error" style="display: none"></p>

      <form id="login-form">
        <h2>Log in</h2>
        <label>Email <input type="email" id="login-email" required /></label>
        <label>Password <input type="password" id="login-password" required /></label>
        <button type="submit">Log in</button>
        <p><a href="#" id="show-register">Need an account? Register</a></p>
      </form>

      <form id="register-form" style="display: none">
        <h2>Register</h2>
        <label>Email <input type="email" id="register-email" required /></label>
        <label>Password <input type="password" id="register-password" minlength="8" required /></label>
        <button type="submit">Register</button>
        <p><a href="#" id="show-login">Already have an account? Log in</a></p>
      </form>
    </section>

    <section id="app-view" style="display: none">
      <div class="app-header">
        <span>Signed in as <strong id="current-user-email"></strong></span>
        <button type="button" id="logout-btn">Log out</button>
      </div>

      <p id="app-error" class="error" style="display: none"></p>

      <form id="new-todo-form">
        <input type="text" id="new-todo-title" placeholder="What needs doing?" required />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list"></ul>
    </section>
  </main>

  <script src="js/vendor/jquery-3.7.1.min.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
