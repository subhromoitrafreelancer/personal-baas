    <text x="310" y="238">the one public door</text>
    <text x="530" y="140">tables become REST</text>
    <text x="530" y="238">sign-in · files · jobs</text>
    <text x="530" y="336">isolated worker</text>
    <text x="760" y="140">data + row-level rules</text>
    <text x="760" y="238">object storage</text>
    <text x="760" y="336">SQL editor · API explorer</text>
