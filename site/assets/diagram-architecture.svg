    <rect x="685" y="92" width="150" height="64"/>
    <rect x="685" y="190" width="150" height="64"/>
    <rect x="685" y="288" width="150" height="64"/>
  </g>
  <g fill="#1d3b34" text-anchor="middle" font-size="19" font-weight="700">
    <text x="104" y="218">Your app</text>
    <text x="310" y="218" fill="#1d3b34">Caddy</text>
    <text x="530" y="120">PostgREST</text>
    <text x="530" y="218">Control service</text>
