<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t1 d1" font-family="'Josefin Sans','Helvetica Neue',Arial,sans-serif">
  <title id="t1">Stead architecture, simplified</title>
  <desc id="d1">An app sends requests to Caddy, the one public door. Inside your server, Caddy forwards data requests to PostgREST and everything else to the control service. PostgREST and the control service use Postgres. The control service also uses MinIO for files and a function runner for serverless code.</desc>
