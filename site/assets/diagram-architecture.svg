  <!-- fence -->
  <rect x="215" y="42" width="650" height="340" fill="none" stroke="#1d3b34" stroke-width="1.5" stroke-dasharray="9 5"/>
  <text x="229" y="66" font-size="14" letter-spacing="2" fill="#1d3b34" font-weight="600">YOUR SERVER · DOCKER COMPOSE</text>
  <g fill="#f1ece0" stroke="#1d3b34" stroke-width="1.6">
